services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: ${POSTGRES_DB:-tasktracker}
    ports:
      - "127.0.0.1:${DB_PORT:-55433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    image: task-tracker-api:local
    build: .
    command: ["-migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/${POSTGRES_DB:-tasktracker}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  api:
    image: task-tracker-api:local
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/${POSTGRES_DB:-tasktracker}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env using openssl rand -hex 32}
      HTTP_ADDR: :8080
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 15s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  postgres_data:
